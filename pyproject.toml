[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snipebot"
version = "0.1.0"
description = "Vigila Wallapop y Vinted y avisa por Telegram cuando aparece una ganga concreta"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
]

[tool.setuptools]
py-modules = ["config", "models", "filters", "storage", "notifier", "main"]

[tool.setuptools.packages.find]
include = ["scrapers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:snipebot.*"]
