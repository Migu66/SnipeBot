name: SnipeBot

on:
  schedule:
    # Cada 30 min, todo el dia, en UTC. GitHub puede retrasar el disparo
    # unos minutos bajo carga; no bajar de esta cadencia (ver CLAUDE.md).
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

concurrency:
  group: snipebot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar ciclo de vigilancia
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Guardar historico de deduplicacion
        run: |
          git config user.name "snipebot-actions"
          git config user.email "actions@users.noreply.github.com"
          # `git add -f` con varios pathspecs aborta SIN anadir nada si uno solo
          # no existe (p.ej. -wal/-shm tras un cierre limpio de SQLite en modo
          # WAL, que los reabsorbe en el .db principal). Por eso se anade cada
          # fichero por separado: así el .db siempre queda en staging aunque
          # los sidecar no existan.
          for f in data/snipebot.db data/snipebot.db-wal data/snipebot.db-shm; do
            [ -f "$f" ] && git add -f "$f"
          done
          if ! git diff --cached --quiet; then
            git commit -m "chore: actualizar historico de notificados"
            git push
          fi
