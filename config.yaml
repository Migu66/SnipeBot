# Valores por defecto. `query`, `price_threshold` y `min_price` se pueden
# cambiar desde Telegram (/producto, /precio, /preciomin) sin tocar esto;
# /reset devuelve el control a lo que ponga aquí.

searches:
  - platform: vinted
    query: "ps5"
    price_threshold: 350
    seller_rating_threshold: 4.5
    min_price: 250
    min_seller_reviews: 3
    allow_unknown_rating: false
    min_condition: "muy bueno"
    max_results: 100

scraping:
  request_delay_seconds: 3.0
  timeout_seconds: 20.0
  max_retries: 3
  backoff_base_seconds: 5.0
  fetch_seller_details: true

database_path: data/snipebot.db
log_level: INFO
